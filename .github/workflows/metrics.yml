name: Gerar metricas do perfil

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/gerar_metricas.py"
      - ".github/workflows/metrics.yml"

jobs:
  metricas:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gera os SVGs a partir da API publica
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/gerar_metricas.py

      - name: Commita se houver mudanca
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/
          if git diff --staged --quiet; then
            echo "Nenhuma mudanca nas metricas."
          else
            git commit -m "Atualiza metricas do perfil"
            git push
          fi
