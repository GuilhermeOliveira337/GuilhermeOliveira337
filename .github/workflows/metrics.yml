name: Gerar metricas do perfil

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metricas:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Painel principal: commits, repositorios e atividade recente
      - name: Estatisticas gerais
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/stats.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: GuilhermeOliveira337
          template: classic
          base: header, repositories
          config_timezone: America/Sao_Paulo
          config_display: large
          config_octicon: "yes"

      # Linguagens mais usadas
      - name: Linguagens
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: GuilhermeOliveira337
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_languages: "yes"
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 1%

      # Calendario de contribuicoes em 3D (substitui o activity graph)
      - name: Calendario de atividade
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/calendar.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: GuilhermeOliveira337
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_isocalendar: "yes"
          plugin_isocalendar_duration: full-year

      # Conquistas (substitui os trophies)
      - name: Conquistas
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/achievements.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: GuilhermeOliveira337
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_achievements: "yes"
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
