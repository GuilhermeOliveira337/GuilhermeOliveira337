<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Obrigado pela visita">
  <title>Obrigado pela visita</title>

  <defs>
    <linearGradient id="fbg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1a1030"/>
      <stop offset="50%"  stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="fneon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ff2e97"/>
      <stop offset="50%"  stop-color="#7b5cff"/>
      <stop offset="100%" stop-color="#00d8ff"/>
    </linearGradient>
    <linearGradient id="ffade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7b5cff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#7b5cff" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#7b5cff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="fgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ff2e97" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="150" fill="url(#fbg)"/>
  <rect width="1000" height="150" fill="url(#fgrid)"/>

  <path d="M0 34 Q 250 60 500 42 T 1000 56" fill="none" stroke="url(#ffade)" stroke-width="1.5"/>

  <rect x="380" y="70" width="240" height="2.5" rx="1.25" fill="url(#fneon)"/>

  <text x="500" y="56" text-anchor="middle"
        font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace"
        font-size="20" font-weight="600" letter-spacing="4"
        fill="#e6f7ff">OBRIGADO PELA VISITA</text>

  <text x="500" y="102" text-anchor="middle"
        font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace"
        font-size="13" letter-spacing="1.5"
        fill="#8b9dc3">guilherme@olyver:~$ exit 0</text>

  <text x="500" y="126" text-anchor="middle"
        font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace"
        font-size="11.5" letter-spacing="1"
        fill="#5d6b8a">linkedin.com/in/guilherme-oliveira-frontend</text>
</svg>
